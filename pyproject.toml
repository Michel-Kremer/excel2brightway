[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "excel2brightway"
version = "0.2.0"
description = "Prueft LCI-Excel-Dateien (Brightway-Format) gegen eigene Datenbanken und ecoinvent, hilft beim Korrigieren in Excel und schreibt sie nach Brightway."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bw2data>=4.0",
    "bw2io>=0.9",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ex2bw-check = "excel2brightway.cli:check"
ex2bw-apply = "excel2brightway.cli:apply"
ex2bw-write = "excel2brightway.cli:write"
ex2bw-migrate = "excel2brightway.cli:migrate"

# Fenster ohne Konsolenfenster (unter Windows wird eine .exe angelegt)
[project.gui-scripts]
ex2bw-gui = "excel2brightway.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::UserWarning:openpyxl"]
